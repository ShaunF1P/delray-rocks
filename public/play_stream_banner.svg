<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440">
  <defs>
    <!-- Dark Onyx to Slate Gradient Background -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>

    <!-- Cobalt to Cyan Logo Gradient -->
    <linearGradient id="bannerLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="45%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="bannerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#2563EB" flood-opacity="0.45"/>
    </filter>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#22D3EE" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 16:9 Background Canvas (2560 x 1440) -->
  <rect width="2560" height="1440" fill="url(#bannerBg)"/>

  <!-- Subtle Ambient Stadium Radial Lighting -->
  <circle cx="1280" cy="720" r="800" fill="#2563EB" opacity="0.07" filter="url(#bannerGlow)"/>
  <circle cx="1280" cy="720" r="400" fill="#22D3EE" opacity="0.04" filter="url(#cyanGlow)"/>

  <!-- Mobile & Desktop Safe Zone Outline (1546 x 423 centered at x=507, y=508) -->
  <!-- Centered Master Lockup inside Safe Zone -->
  <g transform="translate(507, 508)">

    <!-- Emblem Mark -->
    <g transform="translate(260, 130) scale(1.4)" filter="url(#bannerGlow)">
      <path d="M 32 24 L 118 70 L 32 116 Z" 
            fill="none" 
            stroke="url(#bannerLogoGrad)" 
            stroke-width="22" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
    </g>

    <!-- PLAYSTREAM Title Typography -->
    <g transform="translate(500, 240)">
      <text font-family="'Inter', 'Outfit', system-ui, -apple-system, sans-serif" font-weight="900" font-size="104" fill="#FFFFFF" letter-spacing="3">
        PLAYSTREAM
      </text>

      <!-- Network Subtitle Tagline -->
      <text x="6" y="48" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="700" font-size="22" fill="#22D3EE" letter-spacing="14">
        ACTION &amp; SPORTS MEDIA NETWORK
      </text>

      <!-- Broadcast Quality Tag -->
      <text x="6" y="86" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" fill="#94A3B8" letter-spacing="6">
        LIVE 4K 60FPS BROADCASTS • AUTONOMOUS AI COVERAGE
      </text>
    </g>

  </g>
</svg>
