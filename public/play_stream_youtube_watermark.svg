<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ytGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="ytGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#2563EB" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 1:1 Rounded Dark Container Plate -->
  <rect width="512" height="512" rx="96" fill="#0F172A" fill-opacity="0.9" stroke="rgba(34,211,238,0.3)" stroke-width="6"/>

  <!-- PLAYSTREAM Delta Triangle Emblem -->
  <g transform="translate(146, 110) scale(1.6)" filter="url(#ytGlow)">
    <path d="M 32 24 L 118 70 L 32 116 Z" 
          fill="none" 
          stroke="url(#ytGrad)" 
          stroke-width="22" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- PLAYSTREAM Text -->
  <text x="256" y="380" font-family="'Inter', 'Outfit', system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="2" text-anchor="middle">
    PLAYSTREAM
  </text>
  <text x="256" y="425" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="800" font-size="16" fill="#22D3EE" letter-spacing="6" text-anchor="middle">
    SUBSCRIBE
  </text>
</svg>
