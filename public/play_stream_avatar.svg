<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1600" width="1600" height="1600">
  <defs>
    <radialGradient id="avatarBgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#080C14"/>
      <stop offset="100%" stop-color="#040711"/>
    </radialGradient>

    <linearGradient id="avatarLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="45%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <filter id="avatarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="30" flood-color="#2563EB" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 1:1 Full Circular Background Plate -->
  <rect width="1600" height="1600" fill="url(#avatarBgGrad)"/>

  <!-- 100% PERFECT MATHEMATICAL CENTROID (Midpoint y=800) -->
  <g transform="translate(800, 800)" text-anchor="middle">
    <!-- Rounded Play Delta Triangle Emblem Mark (Top y=-330 to y=10) -->
    <g transform="translate(-160, -330)" filter="url(#avatarGlow)">
      <path d="M 50 40 L 280 185 L 50 330 Z" 
            fill="none" 
            stroke="url(#avatarLogoGrad)" 
            stroke-width="64" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
    </g>

    <!-- Main Title Typography: PLAYSTREAM (y=150) -->
    <text y="150" font-family="'Inter', 'Outfit', system-ui, -apple-system, sans-serif" font-weight="900" font-size="108" fill="#FFFFFF" letter-spacing="5">
      PLAYSTREAM
    </text>

    <!-- Subtitle Tagline: MEDIA NETWORK (y=220) -->
    <text y="220" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#22D3EE" letter-spacing="16">
      MEDIA NETWORK
    </text>
  </g>
</svg>
