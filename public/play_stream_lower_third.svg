<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#0B132B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!-- Lower Third Stream Graphic Bar -->
  <path d="M 0 20 L 1000 20 L 1060 140 L 0 140 Z" fill="url(#barGrad)"/>
  <rect x="0" y="20" width="12" height="120" fill="url(#accentGrad)"/>

  <!-- PLAYSTREAM Delta Emblem Mark -->
  <g transform="translate(30, 45) scale(0.6)">
    <path d="M 32 24 L 118 70 L 32 116 Z" fill="none" stroke="url(#accentGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Broadcast Headline & Subtitle -->
  <text x="120" y="75" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="32" fill="#FFFFFF" letter-spacing="1">
    LIVE STREAM • 4K COVERAGE
  </text>
  <text x="120" y="112" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="700" font-size="18" fill="#22D3EE" letter-spacing="4">
    PLAYSTREAM MEDIA NETWORK OFFICIAL BROADCAST
  </text>
</svg>
